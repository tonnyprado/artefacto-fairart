# fly.toml - Configuración para Fly.io
app = "artefacto-backend"
primary_region = "iad" # Virginia (cerca de tu RDS en us-east-2)

# Proceso principal
[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Health check
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Mantener siempre corriendo (importante para cron jobs)
  auto_start_machines = true
  min_machines_running = 1    # Mínimo 1 máquina siempre

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Recursos de la máquina
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
